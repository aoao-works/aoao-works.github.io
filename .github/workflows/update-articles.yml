name: Update note articles

on:
  schedule:
    # 毎日 21:00 UTC (日本時間 06:00) に実行
    - cron: '0 21 * * *'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-articles:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest note articles
        run: node .github/scripts/update-articles.mjs

      - name: Commit and push if changed
        run: |
          if git diff --quiet -- articles.json; then
            echo "No changes to articles.json"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add articles.json
          git commit -m "chore: update note articles"
          git push
